<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTC Time Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 255, 0, 0.05);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        
        h1 {
            color: #d3d3d3;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #888888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 500;
            color: #d3d3d3;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            transition: border-color 0.3s ease;
            background: #0d0d0d;
            color: #d3d3d3;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
            background: #0d0d0d;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        input[type="text"]::placeholder {
            color: #555555;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-convert {
            background: #3498db;
            color: white;
        }
        
        .btn-convert:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        
        .btn-convert:active {
            transform: translateY(0);
        }
        
        .btn-clear {
            background: #2a2a2a;
            color: #d3d3d3;
        }
        
        .btn-clear:hover {
            background: #3a3a3a;
        }
        
        .result {
            background: #0d0d0d;
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
            border-left: 4px solid #3498db;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 15px;
        }
        
        .result-item:not(:last-child) {
            border-bottom: 1px solid #1a1a1a;
        }
        
        .result-label {
            color: #888888;
            font-weight: 500;
        }
        
        .result-value {
            color: #d3d3d3;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }
        
        .result-value.utc {
            color: #27ae60;
            font-weight: 600;
        }
        
        .error {
            background: #1a0000;
            border-left: 4px solid #e74c3c;
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }
        
        .error.show {
            display: block;
        }
        
        .example {
            color: #888888;
            font-size: 13px;
            margin-top: 6px;
        }
        
        .example span {
            background: #1a1a1a;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #d3d3d3;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .example span:hover {
            background: #2a2a2a;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .result-item {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕐 UTC Time Converter</h1>
        <p class="subtitle">Convert local time (Europe/Rome) to UTC</p>
        
        <div class="error" id="errorMessage"></div>
        
        <div class="input-group">
            <label for="timestamp">Enter timestamp</label>
            <input type="text" id="timestamp" placeholder="yyyyMMdd-HHMM" autofocus>
            <div class="example">Example: <span onclick="document.getElementById('timestamp').value='20260315-1430';convertTime()">20260315-1430</span></div>
        </div>
        
        <div class="button-group">
            <button class="btn-convert" onclick="convertTime()">Convert</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>
        
        <div id="resultContainer" style="display: none;">
            <div class="result">
                <div class="result-item">
                    <span class="result-label">Original:</span>
                    <span class="result-value" id="originalTime"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">UTC Time:</span>
                    <span class="result-value utc" id="utcTime"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">UTC Offset:</span>
                    <span class="result-value" id="utcOffset">+1</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getLastSunday(year, month) {
            const lastDay = new Date(year, month, 0).getDate();
            const date = new Date(year, month - 1, lastDay);
            while (date.getDay() !== 0) {
                date.setDate(date.getDate() - 1);
            }
            return date.getDate();
        }

        function isValidTimestamp(timestamp) {
            const regex = /^\d{8}-\d{4}$/;
            if (!regex.test(timestamp)) return false;
            
            const year = parseInt(timestamp.substring(0, 4));
            const month = parseInt(timestamp.substring(4, 6));
            const day = parseInt(timestamp.substring(6, 8));
            const hour = parseInt(timestamp.substring(9, 11));
            const minute = parseInt(timestamp.substring(11, 13));
            
            if (year < 1970 || year > 2100) return false;
            if (month < 1 || month > 12) return false;
            if (day < 1 || day > 31) return false;
            if (hour < 0 || hour > 23) return false;
            if (minute < 0 || minute > 59) return false;
            
            const daysInMonth = new Date(year, month, 0).getDate();
            if (day > daysInMonth) return false;
            
            return true;
        }

        function convertTime() {
            const input = document.getElementById('timestamp');
            const errorDiv = document.getElementById('errorMessage');
            const resultContainer = document.getElementById('resultContainer');
            
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
            
            let timestamp = input.value.trim();
            timestamp = timestamp.replace(/\s/g, '');
            
            if (!isValidTimestamp(timestamp)) {
                errorDiv.textContent = 'ERROR: Invalid format. Please use yyyymmdd-HHMM (e.g., 20260315-1430)';
                errorDiv.classList.add('show');
                resultContainer.style.display = 'none';
                return;
            }
            
            const year = parseInt(timestamp.substring(0, 4));
            const month = parseInt(timestamp.substring(4, 6));
            const day = parseInt(timestamp.substring(6, 8));
            const hour = parseInt(timestamp.substring(9, 11));
            const minute = parseInt(timestamp.substring(11, 13));
            
            const marchSunday = getLastSunday(year, 3);
            const octoberSunday = getLastSunday(year, 10);
            
            let isDst = false;
            
            if (month > 3 && month < 10) {
                isDst = true;
            } else if (month === 3) {
                if (day > marchSunday) {
                    isDst = true;
                } else if (day === marchSunday && hour >= 2) {
                    isDst = true;
                }
            } else if (month === 10) {
                if (day < octoberSunday) {
                    isDst = true;
                } else if (day === octoberSunday && hour < 3) {
                    isDst = true;
                }
            }
            
            const offset = isDst ? 2 : 1;
            
            const date = new Date(Date.UTC(year, month - 1, day, hour, minute));
            const utcDate = new Date(date.getTime() - (offset * 60 * 60 * 1000));
            
            const utcYear = utcDate.getUTCFullYear();
            const utcMonth = String(utcDate.getUTCMonth() + 1).padStart(2, '0');
            const utcDay = String(utcDate.getUTCDate()).padStart(2, '0');
            const utcHour = String(utcDate.getUTCHours()).padStart(2, '0');
            const utcMinute = String(utcDate.getUTCMinutes()).padStart(2, '0');
            
            const utcTime = `${utcYear}${utcMonth}${utcDay}-${utcHour}${utcMinute}`;
            
            document.getElementById('originalTime').textContent = timestamp;
            document.getElementById('utcTime').textContent = utcTime;
            document.getElementById('utcOffset').textContent = `+${offset} (${isDst ? 'CEST' : 'CET'})`;
            
            resultContainer.style.display = 'block';
        }

        function clearAll() {
            document.getElementById('timestamp').value = '';
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('errorMessage').textContent = '';
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('timestamp').focus();
        }

        document.getElementById('timestamp').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                convertTime();
            }
        });

        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('timestamp').focus();
        });
    </script>
</body>
</html>
